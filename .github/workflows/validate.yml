name: Validate ATLAS plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package and skills
        run: python scripts/validate_plugin.py
      - name: Build package
        run: python scripts/package_plugin.py
